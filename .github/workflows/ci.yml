name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SORTIE_GITHUB_TOKEN: placeholder
      SORTIE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n template/scripts/sortie.sh

      - name: Shellcheck
        run: shellcheck install.sh template/scripts/sortie.sh

      - name: Install sortie
        run: |
          curl -sSL https://get.sortie-ai.com/install.sh | SORTIE_VERSION=1.20.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate workflows
        run: |
          for f in template/config/sortie/WORKFLOW.*.md; do
            sortie validate "$f" || exit 1
          done
